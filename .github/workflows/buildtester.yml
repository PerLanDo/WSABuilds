name: Custom Build (for testing purpose)
run-name: WSA ${{ inputs.release_type }} ${{ inputs.arch }} with ${{ inputs.root_sol }} and ${{ inputs.gapps_brand }}

on:
  workflow_dispatch:
    inputs:
      wintype:
        type: choice
        description: Target Windows version
        required: true
        options: ["Windows 10", "Windows 11"]
        default: "Windows 11"
      arch:
        type: choice
        description: Target CPU architecture of WSA
        required: true
        options: [x64, arm64]
        default: x64
      release_type:
        type: choice
        description: WSA release channel
        required: true
        options: ["Retail", "Release Preview", "Insider Slow", "Insider Fast", "Insider Private"]
        default: "Retail"
      user_code:
        type: string
        description: User code for WSA Insider (optional)
        required: false
        default: ""
      root_sol:
        type: choice
        description: Root solution
        required: true
        options: ["Non-root", "KernelSU", "Magisk Stable", "Magisk Beta", "Magisk Canary", "Magisk Debug", "Magisk Alpha (vvb2060)", "Magisk Delta (HuskyDG)"]
        default: "Non-root"
      gapps_brand:
        type: choice
        description: Google Apps package
        required: true
        options: ["MindTheGapps v13.0", "No GApps"]
        default: "MindTheGapps v13.0"
      remove_amazon:
        type: boolean
        description: Remove Amazon Appstore
        required: true
        default: true

jobs:
  build:
    name: Build WSA
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        env:
          TARGET_WINDOWS: ${{ inputs.wintype }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$TARGET_WINDOWS" == "Windows 10" && "$TARGET_ARCH" == "arm64" ]]; then
            echo "Windows 10 patch does not support arm64 architecture" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          check-latest: true
          python-version: "3.x"
          cache: pip
          cache-dependency-path: MagiskOnWSA/scripts/requirements.txt

      - name: Setup Python virtual environment
        working-directory: MagiskOnWSA/scripts
        run: |
          set -euo pipefail
          python3 -m venv ../python3-env
          # shellcheck disable=SC1091
          source ../python3-env/bin/activate
          python3 -m pip install --upgrade -r requirements.txt

      - name: Install Ubuntu dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: e2fsprogs attr unzip qemu-utils python3-venv xmlstarlet curl
          version: 1.0

      - name: Build WSA
        id: wsa
        working-directory: MagiskOnWSA
        env:
          TARGET_ARCH: ${{ inputs.arch }}
          RELEASE_INPUT: ${{ inputs.release_type }}
          ROOT_INPUT: ${{ inputs.root_sol }}
          GAPPS_INPUT: ${{ inputs.gapps_brand }}
          REMOVE_AMAZON: ${{ inputs.remove_amazon }}
          USER_CODE: ${{ inputs.user_code }}
        run: |
          set -euo pipefail
          declare -A releases=(
            ["Retail"]="retail"
            ["Release Preview"]="RP"
            ["Insider Slow"]="WIS"
            ["Insider Fast"]="WIF"
            ["Insider Private"]="latest"
          )
          declare -A roots=(
            ["Non-root"]="none"
            ["KernelSU"]="kernelsu"
            ["Magisk Stable"]="stable"
            ["Magisk Beta"]="beta"
            ["Magisk Canary"]="canary"
            ["Magisk Debug"]="debug"
            ["Magisk Alpha (vvb2060)"]="alpha"
            ["Magisk Delta (HuskyDG)"]="delta"
          )

          root_solution="${roots[$ROOT_INPUT]}"
          magisk_version="stable"
          if [[ "$ROOT_INPUT" == Magisk* ]]; then
            magisk_version="$root_solution"
            root_solution="magisk"
          fi

          args=(
            --arch "$TARGET_ARCH"
            --release-type "${releases[$RELEASE_INPUT]}"
            --magisk-ver "$magisk_version"
            --root-sol "$root_solution"
            --compress-format none
          )
          [[ "$GAPPS_INPUT" == "MindTheGapps v13.0" ]] && args+=(--install-gapps)
          [[ "$REMOVE_AMAZON" == "true" ]] && args+=(--remove-amazon)

          chmod +x ./scripts/build.sh
          mkdir -p download
          printf 'user_code=%s\n' "$USER_CODE" > download/.ms_account
          ./scripts/build.sh "${args[@]}"

      - name: Patch Houdini expiry check
        if: inputs.arch == 'x64'
        working-directory: MagiskOnWSA
        run: |
          chmod +x ./libhoudini/houdini_installer.sh
          ./libhoudini/houdini_installer.sh "${{ steps.wsa.outputs.artifact_folder }}"

      - name: Patch package for Windows 10
        if: inputs.wintype == 'Windows 10'
        working-directory: MagiskOnWSA/output/${{ steps.wsa.outputs.artifact_folder }}
        run: |
          set -euo pipefail
          xmlstarlet ed --inplace --delete "//*[local-name()='Capability' and @Name='customInstallActions']" AppxManifest.xml
          xmlstarlet ed --inplace --delete "//*[local-name()='Extension' and @Category='windows.customInstall']" AppxManifest.xml
          xmlstarlet ed --inplace --update "//*[local-name()='TargetDeviceFamily']/@MinVersion" -v "10.0.19041.264" AppxManifest.xml
          curl --fail --show-error --location "https://github.com/MustardChef/WSAPatch/raw/main/DLLs%20for%20WSABuilds/winhttp.dll" -o WsaClient/winhttp.dll
          curl --fail --show-error --location "https://github.com/MustardChef/WSAPatch/raw/main/DLLs%20for%20WSABuilds/WsaPatch.dll" -o WsaClient/WsaPatch.dll
          curl --fail --show-error --location "https://github.com/MustardChef/WSAPatch/raw/main/DLLs%20for%20WSABuilds/icu.dll" -o WsaClient/icu.dll

      - name: Compress Windows 11 artifact
        if: inputs.wintype == 'Windows 11'
        working-directory: MagiskOnWSA
        run: 7z a -t7z -mx=6 -m0=LZMA2 -ms=on -mmt=8 -- "${{ steps.wsa.outputs.artifact }}.7z" ./output/*

      - name: Compress Windows 10 artifact
        if: inputs.wintype == 'Windows 10'
        working-directory: MagiskOnWSA
        run: 7z a -t7z -mx=6 -m0=LZMA2 -ms=on -mmt=8 -- "${{ steps.wsa.outputs.artifact }}_Windows_10.7z" ./output/*

      - name: Upload Windows 11 artifact
        if: inputs.wintype == 'Windows 11'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wsa.outputs.artifact }}
          path: MagiskOnWSA/${{ steps.wsa.outputs.artifact }}.7z

      - name: Upload Windows 10 artifact
        if: inputs.wintype == 'Windows 10'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wsa.outputs.artifact }}_Windows_10
          path: MagiskOnWSA/${{ steps.wsa.outputs.artifact }}_Windows_10.7z
